# 保时捷字体的 4 个变体（一行一个，字段用 | 分隔）
#
# 格式： 变体键 | module id | 更新文件名 | 自带字体(空格分隔) | 显示名 | zip 里的名字
#
# 注意：
#   · id 全部沿用**老包原来的 id** → 老用户能覆盖安装、无痛升级（这套方案最看重的点）
#   · update 文件名各不一样 → 每个包只收到自己那条更新通道的更新（不会单色被更新成三合一）
#   · 第 6 个字段（zip 名）是**给用户在 Release 页看的**，必须用用户认得的型号名
#     （718/911/gt3），不要用 none/colon/flair 这种内部代号 —— v2.0 线上就是 718/911/gt3。
#     留空则回落到变体键。这个字段只决定 zip 文件名，不参与字体裁剪（字体看第 4 个字段）。
#   · 字体取自三个内置包，逐一核对过尺寸：
#        none.ttf  44,844,492 = 718素装版 base.ttf ✓
#        colon.ttf 44,844,624 = 911经典版 base.ttf ✓
#        flair.ttf 44,844,696 = GT3赛道版 base.ttf ✓

multi|porsche_font_multi|update.json|none colon flair|保时捷字体（三合一）|multi
none|porsche_font_718|update-none.json|none|保时捷字体（718素装版·无色）|718
colon|porsche_font_911|update-colon.json|colon|保时捷字体（911经典版·一点红）|911
flair|porsche_font_gt3|update-flair.json|flair|保时捷字体（GT3赛道版·烈焰）|gt3
