name: Release

# 一次跑完：取字体素材 → 打 4 个包（三合一 + 3 个单色）→ 建 Release → 写回 4 个 update.json
# 手动触发：Actions 页 → 左侧 Release → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ⚠️ 这里指向「字体素材」Release 的附件（三合一 zip，里面是 profiles/*.ttf）。
  #    fonts-v2 = **修好字体身份**的那一版（v3.6 起必须用这个）：
  #      旧版三份字体的 name 表是坏的（postscript 名 = "未定义"），
  #      一加 ColorOS 这类"按 postscriptName 找字体"的 ROM 会满屏方块。
  #      v1 仍然在线（老 tag 的包要能重打），但**不要再退回去**。
  #    换 fonts-v2 之前请确认该 Release 已经建好、附件已上传，否则 CI 会在取字体那步失败。
  FONTS_ZIP_URL: "https://github.com/ayss2188/porsche-font/releases/download/fonts-v2/porsche-font-profiles-v2.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取字体素材（从 Release 附件里拆出三套配色）
        run: |
          set -e
          mkdir -p module/builtin
          if [ -z "$FONTS_ZIP_URL" ] || [ "${FONTS_ZIP_URL#*在此粘贴}" != "$FONTS_ZIP_URL" ]; then
            echo "::warning::还没填 FONTS_ZIP_URL，改用仓库里已有的 builtin/ 字体（如果有）"
          else
            curl -fsSL "$FONTS_ZIP_URL" -o /tmp/fonts.zip
            unzip -o -j /tmp/fonts.zip 'profiles/*.ttf' -d module/builtin/ || true
            unzip -o -j /tmp/fonts.zip 'system/fonts_src/*.ttf' -d module/builtin/ || true
          fi
          echo "---- builtin 里的字体 ----"
          ls -l module/builtin/ || true
          n=$(ls module/builtin/*.ttf 2>/dev/null | wc -l)
          [ "$n" -ge 1 ] || { echo "::error::没有拿到任何字体，无法打包"; exit 1; }

      - name: 读版本号
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(sed -n 's/^version=//p' module/module.prop | head -n1 | tr -d '\r')
          CODE=$(sed -n 's/^versionCode=//p' module/module.prop | head -n1 | tr -d '\r')
          [ -n "$VER" ] && [ -n "$CODE" ] || { echo "::error::module.prop 里读不到 version / versionCode"; exit 1; }
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "::error::Release $VER 已经存在。发新版前请先把 module.prop 的 version 和 versionCode 改大"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 统一换行符（网页编辑过的文件可能带 Windows 换行）
        run: |
          # 在网页上编辑过的文件有可能是 CRLF，而 sh 会直接报错、CI 的打包脚本也会拒绝。
          # 打包**之前**统一转成 LF（和主项目同一招）。
          find module -type f \( -name '*.sh' -o -name '*.prop' -o -name '*.list' \
            -o -name '*.html' -o -name '*.py' -o -name 'update-binary' -o -name 'updater-script' \) \
            -exec sed -i 's/\r$//' {} +
          echo "-- 检查还有没有 CR --"
          if grep -rlP '\r$' module 2>/dev/null | head -n 5; then
            echo "::warning::上面这些文件仍带 CR（二进制文件除外，可忽略）"
          else
            echo "没有 CR ✓"
          fi

      - name: 打 4 个包
        run: |
          # ⚠️ 打包**之前**把本版说明放进 module/changelog.md —— 这是"离线兜底"：
          #    update.sh 的 changelog 命令优先读网上的 UPDATE-<版本>.md，
          #    但国内 raw.github 常被墙、jsDelivr 也可能超时；那时代码会退回读
          #    "$MODDIR/changelog.md"（随模块一起装进来的那份）。
          #    以前 CI 从不生成这个文件 → 那个兜底**从来没生效过**，
          #    用户在弱网下点「更新日志」只会看到一片空白。
          #    放在这里（打 4 个包之前）而不是更早：这样 build-multi.sh 复制
          #    module/ 时会把它带进每一个变体包。
          if [ -f "UPDATE-${{ steps.ver.outputs.ver }}.md" ]; then
            cp "UPDATE-${{ steps.ver.outputs.ver }}.md" module/changelog.md
            echo "已放入 module/changelog.md（$(wc -c < module/changelog.md) 字节）作为离线兜底"
          else
            echo "::warning::仓库里没有 UPDATE-${{ steps.ver.outputs.ver }}.md，离线兜底将缺失（弱网下用户点更新日志会空白）"
          fi
          sh scripts/build-multi.sh module dist
          echo "---- 产物 ----"
          ls -lh dist/
          echo "---- 确认离线兜底进了包 ----"
          for z in dist/*.zip; do
            if unzip -l "$z" | grep -q 'changelog.md'; then
              echo "  OK  $(basename "$z") 含 changelog.md"
            else
              echo "::error::$(basename "$z") 里没有 changelog.md（离线兜底没进包）"
              exit 1
            fi
          done

      - name: 提取本版更新说明（Release 页 + 管理器弹窗都用它）
        run: |
          set -e
          VER="${{ steps.ver.outputs.ver }}"
          # 按**版本号**取，不按"第一段"取：以后在文件顶部加别的段落也不会串味。
          awk -v v="## $VER" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            # 这里必须**直接失败**：没有本版说明 = CHANGELOG 没更新，
            # 管理器弹窗会是一片空白，不如现在就停下来。
            echo "::error::CHANGELOG.md 里找不到 '## $VER' 这一段，请先补上再发版"
            exit 1
          fi
          echo "---- 本版说明（$(wc -l < dist/notes.md) 行）----"
          head -n 3 dist/notes.md

      - name: 建 Release 并挂 4 个包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -e
          gh release create "$VER" \
            --target main \
            --title "保时捷字体 $VER" \
            --notes-file dist/notes.md \
            dist/*.zip

      - name: 写回 4 个 update.json（并生成本版短更新日志）
        env:
          VER: ${{ steps.ver.outputs.ver }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -e
          # ⚠️ changelog 用 jsDelivr CDN，不要用 raw.githubusercontent.com：
          #    raw 域名在国内经常被墙，管理器弹窗会显示 "Not Found"（真机踩过）。
          #    内容指向 UPDATE-<版本>.md ——
          #    update.json 的 changelog 会被管理器弹窗直接显示。
          #
          # ⚠️ 这里**不要用 `head -n 20 dist/notes.md` 覆盖**（2026-10-13 订正）：
          #    · "20 行"从来不是显示上限 —— 管理器读的是**这个文件本身**，
          #      WebUI 那条路是 `update.sh changelog` 的 `head -c 30000`（3 万字符）+ 可滚动；
          #    · 所以按 20 行切只会把说明**断在半句话上**（真机上就是这样，很难看）；
          #    · 而且本项目希望在弹窗里**连历史版本一起给用户看**（从 v3.5 直接升上来的用户
          #      需要知道"我从 3.5 到 3.9 都得到了什么"），那份文件手写在仓库里。
          #    现在的规则：**仓库里已经有 UPDATE-<版本>.md 就原样保留**；
          #    没有才用本版说明兜底生成（保证绝不会出现"弹窗空白"）。
          if [ -s "UPDATE-$VER.md" ]; then
            echo "UPDATE-$VER.md 已存在于仓库（$(wc -l < "UPDATE-$VER.md") 行 / $(wc -c < "UPDATE-$VER.md") 字符）—— 原样保留，不覆盖"
          else
            cp dist/notes.md "UPDATE-$VER.md"
            echo "仓库里没有 UPDATE-$VER.md，已用 dist/notes.md 兜底生成（$(wc -l < "UPDATE-$VER.md") 行）"
          fi
          _LEN=$(wc -c < "UPDATE-$VER.md")
          if [ "$_LEN" -gt 30000 ]; then
            echo "::warning::UPDATE-$VER.md 有 $_LEN 字符，超过 update.sh 的 30000 显示上限，用户会看不全"
          fi
          while IFS='|' read -r key id zipname upfile sum; do
            [ -n "$key" ] || continue
            printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "%s/%s/releases/download/%s/%s",\n  "changelog": "https://cdn.jsdelivr.net/gh/%s@main/UPDATE-%s.md",\n  "sha256": "%s"\n}\n' \
              "$VER" "$CODE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VER" "$zipname" \
              "$GITHUB_REPOSITORY" "$VER" "$sum" > "$upfile"
            echo "已写 $upfile -> $zipname ($sum)"
          done < dist/sha256.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update*.json "UPDATE-$VER.md"
          git commit -m "chore: 更新 update.json / UPDATE-$VER.md（$VER / $CODE）" || echo "没有变化"
          # ⚠️ 这一步要是失败，update.json 就永远停在旧版本，**所有用户都收不到更新**。
          #    而"你正在上传文件"这类并发提交会把推送顶掉（non-fast-forward）——
          #    主项目 v1.0.5 发版时真出过这个事（当时没有重试，只能手动补）。
          #    所以：推 main 用显式 refspec（checkout 出来可能是游离头），失败就 rebase 重试。
          ok=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then ok=1; break; fi
            echo "推送失败，第 $i 次重试..."
            git pull --rebase origin main || true
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            # 重试都失败：把 Release 收回去，这样修好之后能直接重跑工作流
            # （否则重跑会在"Release 已经存在"那一步就退出）
            echo "::error::update.json 没能推上去 —— 用户收不到更新。已撤回 Release，修好后重跑本工作流即可"
            gh release delete "$VER" --yes --cleanup-tag || true
            exit 1
          fi

      - name: 主动刷新 CDN 缓存（重试 + 自查，让用户尽快收到更新）
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          # 更新地址走 jsDelivr（cdn.jsdelivr.net/gh/...@main/...）。不刷缓存的话，
          # 刚发完版用户点「检查更新」可能还是旧版本 —— 表现成"明明发了新版却收不到"。
          #
          # ⚠️ jsDelivr 有**两层**缓存（主项目 2026-10-12 踩了三轮才搞清，本项目照搬）：
          #   · 文件内容层：purge 的语义是"删这份缓存、下次回源"，这一层**有效**；
          #   · **main 分支名 → 哪个提交** 的解析缓存：purge **清不掉**它 ——
          #     所以有时 purge 完回源拿到的还是旧内容（别名还指着旧提交）。
          #   主项目发 1.0.8 时真遇到：CI 的 purge 那步 success，但 CDN 仍给 1.0.7，
          #   手动再 purge 一次才跳过去。
          # 所以这里改成**多轮重试 + 每轮自查**：能刷到就提前结束；刷不到只告警、不当失败
          #   （CDN 抖动不该让发版失败；最长约 12 小时它会自愈）。
          #
          # ⚠️ 本项目有 **4 条更新通道**（三合一 + 3 个单色包），各读自己那份账本 ——
          #    所以每轮要把 4 个 update*.json **全部** purge，并且**逐个回读自查**：
          #    只查 update.json 的话，单色包那三条可能还停在旧版本。
          FILES="update.json update-none.json update-colon.json update-flair.json UPDATE-$VER.md CHANGELOG.md README.md"
          MINE="update.json update-none.json update-colon.json update-flair.json"
          ok=0
          for i in 1 2 3 4 5 6; do
            for f in $FILES; do
              curl -sS --max-time 25 "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/$f" >/dev/null 2>&1 || true
            done
            sleep 12
            bad=""
            for f in $MINE; do
              GOT=$(curl -sS --max-time 25 "https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/$f" 2>/dev/null \
                    | sed -n 's/.*"version"[^"]*"\([^"]*\)".*/\1/p' | head -n1)
              [ "$GOT" = "$VER" ] || bad="$bad $f=${GOT:-读不到}"
            done
            if [ -z "$bad" ]; then
              echo "第 $i 轮：4 条通道都已刷新到 $VER"
              ok=1; break
            fi
            echo "第 $i 轮：还没跟上 ——$bad（期望 $VER）"
          done
          if [ "$ok" = 1 ]; then
            echo "CDN 已刷新：用户现在检查更新就能看到 $VER"
          else
            echo "::warning::CDN 还没完全跟上（jsDelivr 的 main 别名缓存，最长约 12 小时自愈）。"
            echo "  · 不影响手动下载安装（Release 页那条路不走 CDN）；"
            echo "  · 不影响包与账本的正确性（仓库里已经是对的）。"
          fi
